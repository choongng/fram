name: Publish fram-agent

# Fram's release: publishing a GitHub release tagged v<version> uploads the
# fram-agent wheel to PyPI through trusted publishing (no token). Upstream's
# publish.yml builds tau-ai and is left unchanged; disable it on Fram's
# repository. See dev-notes/fram-packaging.md.

on:
  release:
    types:
      - published

permissions: {}

jobs:
  check:
    permissions:
      contents: read
    name: Check the release
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check the tag names main and Fram's version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' packaging/fram/src/fram/__init__.py)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match fram's version $version (expected v$version)."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag $TAG is not on main. Publish only from main."
            exit 1
          fi

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: .python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      - name: Install dependencies
        run: uv sync --dev --locked

      - name: Run tests
        run: uv run pytest

      - name: Run packaging tests
        run: uv run pytest packaging/fram/tests

  publish:
    needs: check
    permissions:
      contents: read
      id-token: write
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0

      # Wheel only: the sources sit outside packaging/fram, so an sdist could
      # not rebuild them.
      - name: Build wheel
        run: uv build --wheel --project packaging/fram --out-dir dist

      - name: Publish wheel
        run: uv publish dist/*.whl
